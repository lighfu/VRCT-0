name: Release VRCT

on:
  push:
    tags:
      - 'v*' # タグが 'v' で始まる場合にトリガー (例: v1.0.0)

jobs:
  release:
    name: Build VRCT
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        shell: pwsh
        run: |
          $TAG_WITH_V = $env:GITHUB_REF -replace "^refs/tags/", ""
          $VERSION_NUM = $TAG_WITH_V -replace "^v", ""
          echo "VERSION=$VERSION_NUM" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Determine release channel
        id: channel
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -match "-(beta|rc)") {
            echo "is_beta=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            echo "is_beta=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Verify version numbers match the tag
        shell: pwsh
        run: |
          $expected = $env:VERSION
          $failed = $false

          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkgVersion -ne $expected) {
            Write-Host "::error::package.json version ($pkgVersion) does not match tag version ($expected)"
            $failed = $true
          }

          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tauriVersion -ne $expected) {
            Write-Host "::error::src-tauri/tauri.conf.json version ($tauriVersion) does not match tag version ($expected)"
            $failed = $true
          }

          $configContent = Get-Content src-python/config.py -Raw
          if ($configContent -notmatch 'self\._VERSION\s*=\s*"([^"]+)"') {
            Write-Host "::error::could not find self._VERSION in src-python/config.py"
            $failed = $true
          } elseif ($Matches[1] -ne $expected) {
            Write-Host "::error::src-python/config.py VERSION ($($Matches[1])) does not match tag version ($expected)"
            $failed = $true
          }

          if ($failed) {
            Write-Host "::error::Version mismatch detected. Bump every version field to $expected before tagging."
            exit 1
          }

      - name: Verify build channel matches the tag
        shell: pwsh
        run: |
          $isBeta = "${{ steps.channel.outputs.is_beta }}" -eq "true"
          $expectedChannel = if ($isBeta) { "beta" } else { "stable" }

          $content = Get-Content src-python/build_channel.py -Raw
          if ($content -notmatch 'BUILD_CHANNEL\s*=\s*"([^"]+)"') {
            Write-Host "::error::could not find BUILD_CHANNEL in src-python/build_channel.py"
            exit 1
          }
          $actualChannel = $Matches[1]

          if ($actualChannel -ne $expectedChannel) {
            Write-Host "::error::BUILD_CHANNEL is '$actualChannel' but tag '${{ github.ref_name }}' implies '$expectedChannel'. Fix src-python/build_channel.py before tagging."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install dependencies
        run: npm install

      - name: Setup Python environment
        run: npm run setup-python

      - name: Install Python script dependencies
        run: pip install tqdm

      - name: Build and package
        run: npm run release-all

      - name: Stage release assets
        id: stage
        shell: pwsh
        run: |
          # The updater (NSIS template.nsi / src-python model.py) always
          # downloads the fixed filename "VRCT_setup.exe" from the tagged
          # release, not the versioned build output filename -- copy it
          # under that name here. The versioned "VRCT_${VERSION}_x64-setup.exe"
          # asset is also kept for humans grabbing a specific build off the
          # release page.
          $versionedExe = "./src-tauri/target/release/bundle/nsis/VRCT_${{ env.VERSION }}_x64-setup.exe"
          $stageDir = "./release_assets"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          Copy-Item -Path $versionedExe -Destination "$stageDir/VRCT_${{ env.VERSION }}_x64-setup.exe"
          Copy-Item -Path $versionedExe -Destination "$stageDir/VRCT_setup.exe"
          Copy-Item -Path ./VRCT.zip -Destination "$stageDir/VRCT.zip"
          Copy-Item -Path ./VRCT_cuda.zip -Destination "$stageDir/VRCT_cuda.zip"

          foreach ($name in @("VRCT_setup.exe", "VRCT.zip", "VRCT_cuda.zip")) {
            $hash = (Get-FileHash -Path "$stageDir/$name" -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$stageDir/$name.sha256" -Value $hash -NoNewline -Encoding ascii
          }

          echo "dir=$stageDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Enforce GitHub's 2 GiB per-asset limit
        shell: pwsh
        run: |
          # GitHub Releases requires every asset to be strictly under 2 GiB
          # (an asset AT 2 GiB is already rejected). Fail early with a clear
          # message instead of letting the upload step 422.
          $limitBytes = 2GB
          $failed = $false
          Get-ChildItem -Path "${{ steps.stage.outputs.dir }}" -File | ForEach-Object {
            if ($_.Length -ge $limitBytes) {
              $mb = [Math]::Round($_.Length / 1MB, 1)
              Write-Host "::error::$($_.Name) is $mb MB, which is at or over GitHub's 2 GiB per-file release asset limit"
              $failed = $true
            }
          }
          if ($failed) {
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.VERSION }}
          draft: false
          prerelease: ${{ steps.channel.outputs.is_beta }}
          files: |
            ${{ steps.stage.outputs.dir }}/VRCT_${{ env.VERSION }}_x64-setup.exe
            ${{ steps.stage.outputs.dir }}/VRCT_setup.exe
            ${{ steps.stage.outputs.dir }}/VRCT_setup.exe.sha256
            ${{ steps.stage.outputs.dir }}/VRCT.zip
            ${{ steps.stage.outputs.dir }}/VRCT.zip.sha256
            ${{ steps.stage.outputs.dir }}/VRCT_cuda.zip
            ${{ steps.stage.outputs.dir }}/VRCT_cuda.zip.sha256
